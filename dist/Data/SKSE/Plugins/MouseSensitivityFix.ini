[General]
; Master enable for all plugin behavior. Set false to bypass transforms while keeping the plugin loaded.
bEnabled=true
; Global sensitivity scalar applied before per-device multipliers.
fGlobalSensitivity=1.0
; Mouse horizontal axis multiplier.
fMouseXAxisMultiplier=1.0
; Mouse vertical axis multiplier.
fMouseYAxisMultiplier=1.0
; Gamepad horizontal axis multiplier.
fGamepadXAxisMultiplier=1.0
; Gamepad vertical axis multiplier. Default 1.0 (same as mouse); lower if vertical look feels too fast.
fGamepadYAxisMultiplier=1.0
; Remove third-person camera smoothing/interpolation.
bEnableSmoothingRemovalHook=true
; Suppress large input spike on focus regain (alt-tab).
bSuppressFocusSpike=true
; Apply sensitivity transform to right-stick gamepad look.
bAffectGamepadLook=true

[Advanced]
; First-person look transforms, pitch normalize, half-rate yaw restore, and slow-time yaw compensation.
bEnableFirstPersonHook=true
; Third-person look transforms and slow-time yaw compensation. Never writes freeRotation.y / TP pitch normalize.
bEnableThirdPersonHook=true
; Disable transforms while game is paused or system menu is open.
bDisableInMenus=false
; Set false if look controls are incorrectly reported as disabled by mods (e.g. camera mods that manage their own input).
bDisableWhenLookControlsDisabled=false
; Treat the first mouse event after this idle gap as a focus-regain spike.
iFocusSpikeGapMs=350
; First-person mouse bow only: X reconstructs from raw pixels * sampled freelook scale * this multiplier.
; 1.0 = freelook-equivalent reconstructed X. Does not scale by zoom/FOV. Third-person mouse bow is not reconstructed.
fBowAimMouseXMultiplier=1.0
; First-person mouse bow only: multiplies the live engine Y delta. 1.0 = keep engine Y. No FOV/eagleEyeY scale.
fBowAimMouseYMultiplier=1.0
; Gamepad bow aim multipliers (both perspectives). INI-only; not reconstructed from pixels.
fBowAimGamepadXMultiplier=1.0
fBowAimGamepadYMultiplier=1.0
; Enables low-frequency sampled hook counters for troubleshooting. Keep false for normal play.
bVerboseLogging=false

[Compatibility]
; When true, CMC keeps removing third-person smoothing even if SmoothCam / Improved Camera are detected.
; When false, CMC skips third-person smoothing intervention if either camera mod is present.
bKeepThirdPersonSmoothingRemovalWithCameraMods=true

[Walking]
; Disabled=true (default) keeps 0.53b feel for this event. Uncheck / set false to apply X/Y.
; Exact first- or third-person only. Neither/both person flags skip the overlay. FOV is never a multiplier.
bWalkingDisabled=true
; Horizontal / vertical overlay scale. Clamp 0.01-20. Shared by mouse and gamepad.
fWalkingXSensitivity=1.0
fWalkingYSensitivity=1.0
bWalkingApplyFirstPerson=true
bWalkingApplyThirdPerson=true

[Running]
; Disabled=true (default) keeps 0.53b feel for this event. Uncheck / set false to apply X/Y.
; Exact first- or third-person only. Neither/both person flags skip the overlay. FOV is never a multiplier.
bRunningDisabled=true
; Horizontal / vertical overlay scale. Clamp 0.01-20. Shared by mouse and gamepad.
fRunningXSensitivity=1.0
fRunningYSensitivity=1.0
bRunningApplyFirstPerson=true
bRunningApplyThirdPerson=true

[Sprinting]
; Disabled=true (default) keeps 0.53b feel for this event. Uncheck / set false to apply X/Y.
; Exact first- or third-person only. Neither/both person flags skip the overlay. FOV is never a multiplier.
bSprintingDisabled=true
; Horizontal / vertical overlay scale. Clamp 0.01-20. Shared by mouse and gamepad.
fSprintingXSensitivity=1.0
fSprintingYSensitivity=1.0
bSprintingApplyFirstPerson=true
bSprintingApplyThirdPerson=true

[BowAim]
; Bow pullback/aiming, including Eagle Eye frames that are still bowAim.
; Disabled=true (default) leaves fBowAim* exactly as 0.53b.
; Enabled replaces fBowAim* for this event (does not multiply 0.35x0.35). Reconstruct X + engine Y still run.
; Exact first- or third-person only. FOV is never a multiplier.
bBowAimDisabled=true
; Horizontal / vertical overlay scale. Clamp 0.01-20. Shared by mouse and gamepad.
fBowAimXSensitivity=1.0
fBowAimYSensitivity=1.0
bBowAimApplyFirstPerson=true
bBowAimApplyThirdPerson=true

[MagicUse]
; Charging/casting only (not merely a spell or staff equipped).
; Disabled=true (default) keeps 0.53b feel. FOV is never a multiplier.
bMagicUseDisabled=true
; Horizontal / vertical overlay scale. Clamp 0.01-20. Shared by mouse and gamepad.
fMagicUseXSensitivity=1.0
fMagicUseYSensitivity=1.0
bMagicUseApplyFirstPerson=true
bMagicUseApplyThirdPerson=true

[OneHand]
; One-handed weapon in use; other hand empty or shield. Not bow/staff/two-hander.
; Disabled=true (default) keeps 0.53b feel. FOV is never a multiplier.
bOneHandDisabled=true
; Horizontal / vertical overlay scale. Clamp 0.01-20. Shared by mouse and gamepad.
fOneHandXSensitivity=1.0
fOneHandYSensitivity=1.0
bOneHandApplyFirstPerson=true
bOneHandApplyThirdPerson=true

[TwoHanded]
; Two-handed melee (greatsword/battleaxe/warhammer). Not bow, staff, or dual wield.
; Disabled=true (default) keeps 0.53b feel. FOV is never a multiplier.
bTwoHandedDisabled=true
; Horizontal / vertical overlay scale. Clamp 0.01-20. Shared by mouse and gamepad.
fTwoHandedXSensitivity=1.0
fTwoHandedYSensitivity=1.0
bTwoHandedApplyFirstPerson=true
bTwoHandedApplyThirdPerson=true

[DualWielding]
; One-handed weapons in both hands, drawn. Disabled=true (default) keeps 0.53b feel.
; FOV is never a multiplier.
bDualWieldingDisabled=true
; Horizontal / vertical overlay scale. Clamp 0.01-20. Shared by mouse and gamepad.
fDualWieldingXSensitivity=1.0
fDualWieldingYSensitivity=1.0
bDualWieldingApplyFirstPerson=true
bDualWieldingApplyThirdPerson=true
